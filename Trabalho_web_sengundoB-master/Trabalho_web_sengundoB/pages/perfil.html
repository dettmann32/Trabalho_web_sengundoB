<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - EcoConecta</title>
  <link rel="stylesheet" href="../style/style.css">

  <style>
    .container{
      height:640px;
    }

    .top{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-top:5px;
    }

    .title{
      margin-top:8px;
      font-size:34px;
      font-weight:bold;
      color:#111;
    }

    .perfil-info{
      margin-top:90px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:30px;
    }

    .perfil-info .nome{
      font-size:28px;
      font-weight:bold;
      color:#26411b;
    }

    .perfil-info .label{
      font-size:16px;
      color:#555;
    }

    .acoes{
      display:flex;
      gap:20px;
      margin-top:10px;
    }

    .acoes a{
      width:170px;
      padding:12px;
      border:none;
      border-radius:25px;
      background:#8bab63;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      text-decoration:none;
      color:#111;
      text-align:center;
      font-size:14px;
    }

    .acoes a:hover{
      transform:scale(1.05);
    }

    @media(max-width:900px){
      .acoes{
        flex-direction:column;
        align-items:center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back-btn" href="recicle.html">
      Voltar
    </a>

    <div class="top">

      <div class="logo">
        <img src="../images/image.png" alt="EcoConecta">
      </div>

      <div class="title">
        Perfil
      </div>

    </div>

    <div class="perfil-info">

      <div class="label">Usuário logado</div>
      <div class="nome" id="nomeUsuario">—</div>

      <div class="acoes">
        <a href="../index.html">Login</a>
        <a href="redefinirPass.html">Redefinir Senha</a>
      </div>

    </div>

    <div class="help" onclick="ajuda()">
      ?
    </div>

  </div>

  <script>
    function ajuda(){
      alert("Página de perfil EcoConecta");
    }

    const logado = JSON.parse(localStorage.getItem("ecoconecta_logado"));
    if(logado){
      document.getElementById("nomeUsuario").textContent = logado.nome;
    }
  </script>

</body>
</html>
