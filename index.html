<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoConecta Login</title>
  <link rel="stylesheet" href="style/style.css">

  <style>
    body{
      background:#c9c3b1;
    }

    .container{
      width:900px;
      height:520px;
      background:#d8efb2;
      display:flex;
      border-radius:4px;
      overflow:hidden;
      padding:0;
    }

    .left{
      width:55%;
      padding:40px;
      display:flex;
      flex-direction:column;
    }

    .logo{
      width:70px;
      height:70px;
      border:2px solid #7a9b52;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:10px;
    }

    .logo img{
      width:40px;
      height:40px;
      object-fit:contain;
    }

    .brand{
      font-size:12px;
      font-weight:bold;
      margin-bottom:60px;
      color:#1d1d1d;
    }

    .form-group{
      margin-bottom:12px;
      width:250px;
    }

    label{
      display:block;
      font-size:11px;
      font-weight:bold;
      margin-bottom:4px;
      color:#222;
    }

    input{
      width:100%;
      padding:10px;
      border:none;
      border-radius:3px;
      background:#8eb26b;
      color:white;
      outline:none;
    }

    input::placeholder{
      color:#e6e6e6;
    }

    .btn{
      margin-top:12px;
      width:170px;
      padding:10px;
      border:none;
      border-radius:20px;
      background:white;
      cursor:pointer;
      font-size:12px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    .forgot{
      margin-top:12px;
      font-size:11px;
      color:#365f96;
      cursor:pointer;
      width:fit-content;
    }

    .forgot:hover{
      text-decoration:underline;
    }

    .register{
      margin-top:auto;
      font-size:11px;
      color:#365f96;
      cursor:pointer;
    }

    .right{
      width:45%;
      background:url('images/mundo.png')
      center/cover no-repeat;
      border-radius:20px 0 0 20px;
      position:relative;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(154, 201, 83, 0.15);
    }

    @media(max-width:768px){
      .container{
        flex-direction:column;
        width:95%;
        height:auto;
      }

      .left, .right{
        width:100%;
      }

      .right{
        height:300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">

      <div class="logo"><img src="images/image.png" alt="EcoConecta"></div>
      <div class="brand">ECOCONECTA</div>

      <div class="form-group">
        <label>LOGIN</label>
        <input type="text" id="login">
      </div>

      <div class="form-group">
        <label>SENHA</label>
        <input type="password" id="senha">
      </div>

      <button class="btn" onclick="entrar()">
        ACESSAR CONTA
      </button>

      <a class="forgot" href="pages/redefinirPass.html">
        ESQUECI MINHA SENHA
      </a>

      <div class="register" onclick="registrar()">
        REGISTRAR
      </div>

    </div>

    <div class="right">
      <div class="overlay"></div>
    </div>

  </div>

  <script src="js/auth.js"></script>
  <script>
    carregarUsuarios();
  </script>

</body>
</html>
