<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Jardim Camburi</title>
  <link rel="stylesheet" href="../style/style.css">

  <style>
    .container{
      height:640px;
    }

    .logo-area{
      display:flex;
      justify-content:center;
      margin-top:10px;
      margin-bottom:20px;
    }

    .map-container{
      width:620px;
      height:420px;
      margin:0 auto;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }

    @media(max-width:800px){
      .map-container{
        width:100%;
        height:350px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back-btn" href="recicle.html">
      Voltar
    </a>

    <div class="logo-area">
      <div class="logo"><img src="../images/image.png" alt="EcoConecta"></div>
    </div>

    <div class="map-container">

      <iframe
        src="https://www.google.com/maps?q=Jardim+Camburi+Vitória+ES&output=embed"
        loading="lazy"
        allowfullscreen>
      </iframe>

    </div>

    <div class="help" onclick="ajuda()">
      ?
    </div>

  </div>

  <script>
    function ajuda(){
      alert("Mapa de Jardim Camburi - Vitória/ES");
    }
  </script>

</body>
</html>
