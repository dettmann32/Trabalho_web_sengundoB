<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoConecta</title>
  <link rel="stylesheet" href="../style/style.css">

  <style>
    .container{
      height:650px;
      display:flex;
      overflow:hidden;
      padding:0;
    }

    .left{
      width:47%;
      padding:20px 35px;
      display:flex;
      flex-direction:column;
    }

    .menu{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-bottom:25px;
    }

    .menu a{
      padding:4px 10px;
      border:none;
      border-radius:12px;
      background:#8bab63;
      color:#111;
      font-size:11px;
      cursor:pointer;
      transition:0.3s;
      text-decoration:none;
    }

    .menu a:hover{
      transform:scale(1.05);
    }

    .logo-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-top:10px;
    }

    .title{
      margin-top:10px;
      font-size:28px;
      font-weight:bold;
      color:#111;
    }

    .card{
      width:280px;
      background:#bde27d;
      padding:35px 25px;
      border-radius:6px;
      margin-top:55px;
      margin-left:25px;
      line-height:1.5;
      text-align:center;
      color:#26411b;
      font-size:15px;
    }

    .right{
      width:53%;
      position:relative;
      background:
      linear-gradient(rgba(210,255,160,0.35), rgba(210,255,160,0.35)),
      url('../images/mundo.png');
      background-size:cover;
      background-position:center;
      border-radius:25px 0 0 25px;
    }

    @media(max-width:900px){
      .container{
        flex-direction:column;
      }

      .left,
      .right{
        width:100%;
      }

      .right{
        height:350px;
      }

      .card{
        margin-left:0;
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">

      <div class="menu">
        <a href="perfil.html">Perfil</a>
        <a href="mapa.html">Mapa</a>
        <a href="selos.html">Selos</a>
        <a href="impacto.html">Impacto</a>
        <a href="dicas.html">Dicas</a>
        <a href="cooperativas.html">Cooperativas</a>
        <a href="desafios.html">Desafios</a>
        <a href="ranking.html">Ranking</a>
        <a href="noticias.html">Notícias</a>
        <a href="agenda.html">Agenda</a>
      </div>

      <div class="logo-area">
        <div class="logo"><img src="../images/image.png" alt="EcoConecta"></div>
        <div class="title">Ecoconecta</div>
      </div>

      <div class="card" id="texto">
        Conectamos eventos com recicladores e cooperativas próximas,
        otimizando rotas e rastreando o impacto ambiental.
        Receba mais selos sustentáveis e impulsione um futuro mais verde
      </div>

    </div>

    <div class="right">

      <div class="help" onclick="ajuda()">
        ?
      </div>

    </div>

  </div>

  <script>
    function ajuda(){
      alert("Central de ajuda EcoConecta");
    }
  </script>

</body>
</html>
