<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selos - EcoConecta</title>
  <link rel="stylesheet" href="../style/style.css">

  <style>
    .container{
      height:640px;
    }

    .top{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-top:5px;
    }

    .title{
      margin-top:8px;
      font-size:30px;
      font-weight:bold;
      color:#111;
    }

    .badges{
      margin-top:70px;
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:40px 25px;
      justify-items:center;
    }

    .badge{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      transition:0.3s;
      cursor:pointer;
    }

    .badge:hover{
      transform:translateY(-6px);
    }

    .circle{
      width:110px;
      height:110px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:50px;
      margin-bottom:10px;
      color:#1d4b2d;
      font-weight:bold;
    }

    .light{
      background:#b8d69c;
    }

    .dark{
      background:#62b356;
      color:white;
    }

    .badge span{
      font-size:18px;
      font-weight:bold;
      color:#21411c;
      line-height:1.2;
    }

    @media(max-width:900px){
      .badges{
        grid-template-columns:repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back-btn" href="recicle.html">
      Voltar
    </a>

    <div class="top">

      <div class="logo">
        <img src="../images/image.png" alt="EcoConecta">
      </div>

      <div class="title">
        Selos
      </div>

    </div>

    <div class="badges">

      <div class="badge">
        <div class="circle light">📦</div>
        <span>Reutilizador<br>Criativo</span>
      </div>

      <div class="badge">
        <div class="circle light">🗑️</div>
        <span>Coleta<br>Consciente</span>
      </div>

      <div class="badge">
        <div class="circle light">♻️</div>
        <span>Reciclador<br>Iniciante</span>
      </div>

      <div class="badge">
        <div class="circle dark">🌿</div>
        <span>Guardião<br>Verde</span>
      </div>

      <div class="badge">
        <div class="circle light">✅</div>
        <span>Constância<br>Ecológica</span>
      </div>

      <div class="badge">
        <div class="circle dark">∞</div>
        <span>Eco-hábito</span>
      </div>

      <div class="badge">
        <div class="circle light">🧠</div>
        <span>Consciente</span>
      </div>

      <div class="badge">
        <div class="circle light">🌱</div>
        <span>1kg<br>Reciclado</span>
      </div>

      <div class="badge">
        <div class="circle light">🌳</div>
        <span>10kg<br>Reciclados</span>
      </div>

    </div>

    <div class="help" onclick="ajuda()">
      ?
    </div>

  </div>

  <script>
    function ajuda(){
      alert("Página de selos ecológicos EcoConecta");
    }
  </script>

</body>
</html>
