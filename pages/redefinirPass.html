<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoConecta - Redefinir Senha</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body class="pagina-redefinir">

    <main class="redefinir-pagina">
        <section class="redefinir-card">
            <div class="redefinir-topo">
                <img src="../images/image.png" alt="Logo do EcoConecta" class="redefinir-logo">
                <div class="redefinir-marca">
                    <h1>EcoConecta</h1>
                    <p>Recupere o acesso à sua conta de forma simples e rápida.</p>
                </div>
            </div>

            <div class="redefinir-texto">
                <h2>Redefinir senha</h2>
                <p>Informe seu login, sua nova senha e confirme os dados para atualizar o acesso.</p>
            </div>

            <form class="redefinir-formulario" id="formRedefinirSenha">
                <div class="campo-formulario">
                    <label for="loginRecuperacao">Login</label>
                    <input type="text" id="loginRecuperacao" name="loginRecuperacao" placeholder="Digite seu login" required>
                </div>

                <div class="campo-formulario">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" placeholder="Digite a nova senha" required>
                </div>

                <div class="campo-formulario">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a nova senha" required>
                </div>

                <button type="submit" class="botao-principal">Salvar nova senha</button>

                <div class="redefinir-acoes">
                    <a href="../index.html" class="link-login">Voltar para o login</a>
                </div>

                <p id="mensagemRedefinir" class="mensagem-login"></p>
            </form>
        </section>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
